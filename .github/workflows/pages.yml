# Deploy the playable Pixel Ukraine site to GitHub Pages.
# The repo root is not a playable site: the playable site is a BUILT trip.
# This workflow copies the already-baked trips/ukraine-loop (data, art, route,
# site) into dist/, runs scripts/viewer.mjs install() on it (which copies in
# templates/viewer.html, road.js, layout.js, regionmap.js, regions/, fonts/,
# sfx/), and deploys dist/ via GitHub Pages. No re-bake, no secrets.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build playable site
        run: |
          cp -r trips/ukraine-loop dist
          node -e "import('./scripts/viewer.mjs').then(async m => { await m.install('dist'); })"
          test -f dist/index.html
          test -f dist/regionmap.js
          test -f dist/regions/registry.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
