# Deploy the playable Pixel Ukraine site to GitHub Pages.
# The repo root is not a playable site: the playable site is a BUILT trip.
# This workflow copies the already-baked trips into dist/, runs
# scripts/viewer.mjs install() on each (which copies in templates/viewer.html,
# road.js, layout.js, regionmap.js, regions/, fonts/, sfx/, and writes
# trips.json — the cross-links between the trips), and deploys dist/ via
# GitHub Pages. No re-bake, no secrets.
#
# Site layout: ukraine-loop is the front page ('/'); every other trip is a
# folder of its own ('/korosten/'). That convention lives in viewer.mjs —
# add a trip folder under trips/ and one install() line here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build playable site
        run: |
          cp -r trips/ukraine-loop dist
          cp -r trips/korosten dist/korosten
          node -e "import('./scripts/viewer.mjs').then(async m => { await m.install('dist'); await m.install('dist/korosten'); })"
          test -f dist/index.html
          test -f dist/trips.json
          test -f dist/korosten/index.html
          test -f dist/korosten/trips.json
          test -f dist/regionmap.js
          test -f dist/regions/registry.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
